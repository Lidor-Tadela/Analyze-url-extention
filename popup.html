<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 200px;
            padding: 15px;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .next-btn {
            background: #4CAF50;
            color: white;
        }

        .next-btn:hover {
            background: #45a049;
        }

        .prev-btn {
            background: #2196F3;
            color: white;
        }

        .prev-btn:hover {
            background: #1976D2;
        }

        .info {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h3>Chapter Navigation</h3>

    <button id="nextChapter" class="next-btn">Next Chapter</button>
    <button id="prevChapter" class="prev-btn">Previous Chapter</button>

    <div class="info">
        <strong>Keyboard shortcuts:</strong><br>
        → or N: Next chapter<br>
        ← or P: Previous chapter
    </div>

    <script src="popup.js"></script>
</body>
</html>
